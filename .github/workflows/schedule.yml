name: products-scraping

# ---------------------------------------------------------------------------
# Fan-out for price updates. ONE JOB PER RETAILER (all of its
# categories sequentially), not one job per retailer:category.
#
# Why the shape changed: the per-domain politeness limit
# (src/lib/retailers/retailers.ts:320, e.g. ultrapc.ma = 20 req/min, 2
# concurrent) is enforced from an in-memory window inside each scraper
# process (src/lib/scraper/readiness.ts:273). With a pair-per-job matrix, the
# 8 categories of one shop ran as 8 separate processes, each believing it was
# polite, and the shop saw ~100-160 req/min from several runner IPs at once.
# That is how a retailer starts refusing GitHub egress - ultrapc did on
# 2026-10-26 and every one of its 2390 links failed from then on.
#
# Why the hour limit stopped being the answer: the scraper now bounds itself.
# Keep these three numbers in this order or the job gets killed again and
# uploads nothing:
#
#   JOB_BUDGET_MINUTES  <  PRICE_UPDATE_LEASE_TTL_MINUTES  (a pass must not
#                                                            outrun its lease)
#   JOB_BUDGET_MINUTES + setup margin  <  timeout-minutes  (the scraper must
#                                                            stop first)
#
# Current: 60 < 90, and 60 + ~12 setup < 75.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "0 0,6,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_VERSION: "10"
  NODE_VERSION: "22"
  # One knob table for the whole night. All three are safe to tune here.
  JOB_BUDGET_MINUTES: "60"
  MAX_AGE_HOURS: "5"
  PRICE_UPDATE_LEASE_TTL_MINUTES: "90"

jobs:
  get-pairs:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.get.outputs.pairs }}
      groups: ${{ steps.get.outputs.groups }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MAIN_REPO }}
          token: ${{ secrets.MY_PAT }}
          path: project

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: project
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma generate

      - name: Get retailer-category pairs
        working-directory: project
        id: get
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # "auto" expands to the residential set (nextlevelpc, inmedia, iris,
          # setupgame, inbit, progear, ultrapc). Those shops run on the home
          # laptop; GitHub egress is blocked by them. Keep this in sync with
          # src/lib/retailers/residentialRouting.ts.
          EXCLUDE_RETAILERS: "auto"
        shell: bash
        run: |
          set -euo pipefail
          echo "Current dir: $(pwd)"

          pairs=$(pnpm exec tsx scripts/get-retailer-category-pairs.ts)
          if [ -z "$pairs" ] || [ "$pairs" = "null" ]; then
            pairs="[]"
          fi

          # Group "retailer:Category" pairs into one entry per retailer.
          groups=$(printf '%s' "$pairs" | jq -c '
            [ .[] | { r: (split(":")[0]), c: (split(":")[1]) } ]
            | group_by(.r)
            | map({ retailer: .[0].r, categories: (map(.c) | sort) })')

          d1=$(dd if=/dev/urandom bs=1 count=16 2>/dev/null | od -An -tx1 | tr -d ' \n')
          {
            echo "pairs<<$d1"
            echo "$pairs"
            echo "$d1"
          } >> "$GITHUB_OUTPUT"

          d2=$(dd if=/dev/urandom bs=1 count=16 2>/dev/null | od -An -tx1 | tr -d ' \n')
          {
            echo "groups<<$d2"
            echo "$groups"
            echo "$d2"
          } >> "$GITHUB_OUTPUT"

          echo "Shops: $(printf '%s' "$groups" | jq 'length') / pairs: $(printf '%s' "$pairs" | jq 'length')"

  run:
    needs: get-pairs
    if: ${{ needs.get-pairs.outputs.pairs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Fewer, longer jobs than the pair matrix, so concurrency goes up while
      # the aggregate request rate per shop goes down. One shop is still only
      # ever in one job at a time.
      max-parallel: 8
      matrix:
        group: ${{ fromJson(needs.get-pairs.outputs.groups) }}
    timeout-minutes: 75
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: >-
          --health-cmd="curl -f http://localhost:8191/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MAIN_REPO }}
          token: ${{ secrets.MY_PAT }}
          path: project

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml

      - name: Locate pnpm store
        id: pnpm-store
        working-directory: project
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('project/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('project/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-

      - name: Install dependencies
        working-directory: project
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma generate

      - name: Install Playwright browsers
        working-directory: project
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for FlareSolverr
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://flaresolverr:8191/health > /dev/null 2>&1; then
              echo "FlareSolverr ready"
              exit 0
            fi
            echo "Waiting for FlareSolverr... ($i/30)"
            sleep 3
          done
          echo "FlareSolverr failed to start"
          exit 1

      - name: Run scraper (one process per shop, categories sequential)
        id: scrape
        working-directory: project
        shell: bash
        # Kept on purpose: every category must still be attempted (and every
        # verdict recorded) even after one shop's pair fails. The real gate is
        # "Fail the job" further down.
        continue-on-error: true
        env:
          ENABLE_SCRAPING: "true"
          RETAILER: ${{ matrix.group.retailer }}
          CATEGORIES: ${{ join(matrix.group.categories, ' ') }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          CF_BACKEND: flaresolverr
          CF_BYPASS_API_URL: http://flaresolverr:8191
          TWO_CAPTCHA_KEY: ${{ secrets.TWO_CAPTCHA_KEY }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          EXCLUDE_RETAILERS: "auto"
          JOB_BUDGET_MINUTES: ${{ env.JOB_BUDGET_MINUTES }}
          MAX_AGE_HOURS: ${{ env.MAX_AGE_HOURS }}
          PRICE_UPDATE_LEASE_TTL_MINUTES: ${{ env.PRICE_UPDATE_LEASE_TTL_MINUTES }}
        run: |
          # Exit codes are handled by hand below, so no -e: a non-zero pair is
          # data, not a reason to abandon the rest of the shop.
          set +e
          set -u

          budget="${JOB_BUDGET_MINUTES:-60}"
          run_id="${{ github.run_id }}"

          read -r -a cats <<< "$CATEGORIES"
          if [ "${#cats[@]}" -eq 0 ]; then
            echo "No categories for $RETAILER"
            exit 0
          fi

          # Rotate the category order every run. Without this, a shop whose
          # first categories eat the budget never gets to the tail ones, tick
          # after tick. Rotation makes the starvation rotate as well.
          rot=$(( run_id % ${#cats[@]} ))
          cats=( "${cats[@]:rot}" "${cats[@]:0:rot}" )
          echo "Order for $RETAILER: ${cats[*]}"

          : > verdicts.log
          rc=0
          for cat in "${cats[@]}"; do
            left=$(( budget - SECONDS / 60 - 2 ))
            if [ "$left" -lt 5 ]; then
              echo "BUDGET EXHAUSTED: $RETAILER:$cat not attempted this tick" | tee -a verdicts.log
              rc=0
              break
            fi

            echo "::group::$RETAILER:$cat (${left}m budget)"
            # --stale-only keeps an overlapping tick from re-scraping what the
            # previous tick just refreshed. --max-minutes is what lets the
            # scraper stop itself, report, and release its lease, instead of
            # being killed by timeout-minutes with nothing uploaded.
            # Optional, try only if the night is still too slow:
            #   --skip-images --skip-revalidate
            stdbuf -oL pnpm -s scrape:update-prices \
              --retailer "$RETAILER" --category "$cat" \
              --stale-only --max-age-hours "$MAX_AGE_HOURS" \
              --max-minutes "$left" \
              --report --max-failure-rate 50 2>&1 | tee -a scrape-output.log
            code=${PIPESTATUS[0]}
            echo "::endgroup::"

            case "$code" in
              0)   ;;
              75)  echo "STARVED (overlapping lease): $RETAILER:$cat" | tee -a verdicts.log ;;
              1)   echo "FAILED (failure rate): $RETAILER:$cat" | tee -a verdicts.log; rc=1 ;;
              *)   echo "FAILED ($code): $RETAILER:$cat" | tee -a verdicts.log; rc=1 ;;
            esac
          done

          # A shop that ran out of budget is expected, not an error: the
          # unattempted categories stay stale and the next tick takes them,
          # oldest first.
          exit $rc

      - name: Upload artifacts
        # always(): a job that used to be killed at the timeout reached none of
        # the old failure-only conditions, so the one case that most needed
        # evidence uploaded nothing.
        if: always() && steps.scrape.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ matrix.group.retailer }}-${{ github.run_id }}
          path: |
            project/reports/
            project/scrape-output.log
            project/verdicts.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish the per-shop verdict
        if: always() && steps.scrape.conclusion != 'skipped'
        working-directory: project
        shell: bash
        run: |
          {
            echo "### ${{ matrix.group.retailer }} — $(date -u '+%H:%M UTC')"
            grep -hE 'PRICE UPDATE SUMMARY|Total links:|Updated:|Unchanged:|Failed:|SKIPPED:|STARVED:|IDLE:|CAPPED:|Next cursor:' scrape-output.log | sed 's/^/    /' || true
            if [ -s verdicts.log ]; then
              echo
              echo '**verdicts**'
              sed 's/^/- /' verdicts.log
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if a pair genuinely failed
        if: steps.scrape.outcome == 'failure'
        run: exit 1

  notify:
    needs:
      - get-pairs
      - run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect results
        id: collect
        shell: bash
        run: |
          RUN_RESULT="${{ needs.run.result }}"
          if [ "$RUN_RESULT" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="All shops processed"
            COLOR=5763719
          elif [ "$RUN_RESULT" = "skipped" ]; then
            STATUS_EMOJI="⏭️"
            STATUS_TEXT="Skipped (no pairs)"
            COLOR=16763904
          elif [ "$RUN_RESULT" = "cancelled" ]; then
            STATUS_EMOJI="❌"
            STATUS_TEXT="Cancelled (timeout-minutes?)"
            COLOR=15548997
          else
            STATUS_EMOJI="⚠️"
            STATUS_TEXT="Some shops failed"
            COLOR=16744480
          fi
          PAIRS_RAW='${{ needs.get-pairs.outputs.pairs }}'
          GROUPS_RAW='${{ needs.get-pairs.outputs.groups }}'
          PAIR_COUNT=$(echo "$PAIRS_RAW" | jq '. | length' 2>/dev/null || echo "0")
          SHOP_COUNT=$(echo "$GROUPS_RAW" | jq '. | length' 2>/dev/null || echo "0")
          echo "status_emoji=$STATUS_EMOJI" >> "$GITHUB_OUTPUT"
          echo "status_text=$STATUS_TEXT" >> "$GITHUB_OUTPUT"
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"
          echo "pair_count=$PAIR_COUNT" >> "$GITHUB_OUTPUT"
          echo "shop_count=$SHOP_COUNT" >> "$GITHUB_OUTPUT"

      - name: Send notification
        env:
          STATUS_EMOJI: ${{ steps.collect.outputs.status_emoji }}
          STATUS_TEXT: ${{ steps.collect.outputs.status_text }}
          COLOR: ${{ steps.collect.outputs.color }}
          PAIR_COUNT: ${{ steps.collect.outputs.pair_count }}
          SHOP_COUNT: ${{ steps.collect.outputs.shop_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.triggering_actor }}
          WEBHOOK: ${{ secrets.WEBHOOK }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          jq -n \
            --arg emoji "$STATUS_EMOJI" \
            --arg status "$STATUS_TEXT" \
            --argjson color "$COLOR" \
            --arg count "$PAIR_COUNT" \
            --arg shops "$SHOP_COUNT" \
            --arg url "$RUN_URL" \
            --arg run_id "$RUN_ID" \
            --arg run_number "$RUN_NUMBER" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              embeds: [{
                title: ($emoji + " Price Update " + (if $emoji == "✅" then "Succeeded" elif $emoji == "⚠️" then "Partial" else "Failed" end)),
                color: $color,
                fields: [
                  { name: "Status", value: $status, inline: true },
                  { name: "Shops", value: $shops, inline: true },
                  { name: "Pairs", value: $count, inline: true },
                  { name: "Run", value: ("#" + $run_number + " (ID: " + $run_id + ")"), inline: true },
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Triggered by", value: $actor, inline: true },
                  { name: "Actions URL", value: $url, inline: false }
                ],
                timestamp: $date,
                footer: { text: "Scraper" }
              }]
            }' | curl -s -H "Content-Type: application/json" -d @- "$WEBHOOK"
