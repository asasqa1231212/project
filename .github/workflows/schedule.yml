name: Schedule Scraper

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run scraper
        working-directory: project
        env:
          ENABLE_SCRAPING: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          CF_BACKEND: flaresolverr
          CF_BYPASS_API_URL: http://flaresolverr:8191
        run: |
          pnpm -s scrape:update-prices

  notify:
    needs: run
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Success notification
        if: needs.run.result == 'success'
        env:
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK: ${{ secrets.WEBHOOK }}
        run: |
          jq -n \
          --arg url "$URL" \
          --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '{
            embeds: [{
              title: "✅ Tracker Updated",
              description: "Scraping completed successfully.",
              color: 5763719,
              fields: [
                {
                  name: "Status",
                  value: "All categories processed",
                  inline: false
                },
                {
                  name: "Run",
                  value: $url,
                  inline: false
                }
              ],
              timestamp: $date
            }]
          }' | curl -s -H "Content-Type: application/json" -d @- $WEBHOOK

      - name: Failure notification
        if: needs.run.result == 'failure'
        env:
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK: ${{ secrets.WEBHOOK }}
        run: |
          jq -n \
          --arg url "$URL" \
          --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '{
            embeds: [{
              title: "❌ Tracker Failed",
              description: "Some scraping jobs failed.",
              color: 15548997,
              fields: [
                {
                  name: "Logs",
                  value: $url,
                  inline: false
                }
              ],
              timestamp: $date
            }]
          }' | curl -s -H "Content-Type: application/json" -d @- $WEBHOOK
