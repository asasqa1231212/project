        working-directory: project
        env:
          ENABLE_SCRAPING: "true"
          CATEGORY: ${{ matrix.category }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          CF_BACKEND: flaresolverr
          CF_BYPASS_API_URL: http://flaresolverr:8191
          TWO_CAPTCHA_KEY: ${{ secrets.TWO_CAPTCHA_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_URL_1: ${{ secrets.PROXY_URL_1 }}
          PROXY_URL_2: ${{ secrets.PROXY_URL_2 }}
          PROXY_URL_3: ${{ secrets.PROXY_URL_3 }}
          PROXY_URL_4: ${{ secrets.PROXY_URL_4 }}
          PROXY_URL_5: ${{ secrets.PROXY_URL_5 }}
          PROXY_URL_6: ${{ secrets.PROXY_URL_6 }}
          PROXY_URL_7: ${{ secrets.PROXY_URL_7 }}
          PROXY_URL_8: ${{ secrets.PROXY_URL_8 }}
          PROXY_URL_9: ${{ secrets.PROXY_URL_9 }}
          PROXY_URL_10: ${{ secrets.PROXY_URL_10 }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        continue-on-error: true
        run: pnpm -s scrape:update-prices 2>&1 | tee "${{ runner.temp }}/scrape-output.log"

      - name: Upload artifacts on failure
        if: steps.scrape.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: scrape-report-${{ matrix.category }}-${{ github.run_id }}
          path: |
            project/reports
            ${{ runner.temp }}/scrape-output.log
          retention-days: 7

      - name: Fail step if scrape failed
        if: steps.scrape.outcome == 'failure'
        run: exit 1

  notify:
    needs:
      - get-categories
      - run

    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Collect results
        id: collect
        shell: bash
        run: |
          # Determine overall status
          RUN_RESULT="${{ needs.run.result }}"

          if [ "$RUN_RESULT" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="All categories processed"
            COLOR=5763719
          elif [ "$RUN_RESULT" = "skipped" ]; then
            STATUS_EMOJI="⏭️"
            STATUS_TEXT="Skipped (no categories)"
            COLOR=16763904
          elif [ "$RUN_RESULT" = "cancelled" ]; then
            STATUS_EMOJI="❌"
            STATUS_TEXT="Cancelled"
            COLOR=15548997
          else
            STATUS_EMOJI="⚠️"
            STATUS_TEXT="Some categories failed"
            COLOR=16744448
          fi

          CATEGORIES_RAW='${{ needs.get-categories.outputs.categories }}'
          CATEGORY_COUNT=$(echo "$CATEGORIES_RAW" | jq '. | length' 2>/dev/null || echo "0")

          echo "status_emoji=$STATUS_EMOJI" >> "$GITHUB_OUTPUT"
          echo "status_text=$STATUS_TEXT" >> "$GITHUB_OUTPUT"
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"
          echo "category_count=$CATEGORY_COUNT" >> "$GITHUB_OUTPUT"

      - name: Send notification
        env:
          STATUS_EMOJI: ${{ steps.collect.outputs.status_emoji }}
          STATUS_TEXT: ${{ steps.collect.outputs.status_text }}
          COLOR: ${{ steps.collect.outputs.color }}
          CATEGORY_COUNT: ${{ steps.collect.outputs.category_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.triggering_actor }}
          WEBHOOK: ${{ secrets.WEBHOOK }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          jq -n \
            --arg emoji "$STATUS_EMOJI" \
            --arg status "$STATUS_TEXT" \
            --argjson color "$COLOR" \
            --arg count "$CATEGORY_COUNT" \
            --arg url "$RUN_URL" \
            --arg run_id "$RUN_ID" \
            --arg run_number "$RUN_NUMBER" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              embeds: [{
                title: ($emoji + " Price Update " + (if $emoji == "✅" then "Succeeded" else if $emoji == "⚠️" then "Partial" else "Failed" end end)),
                color: $color,
                fields: [
                  { name: "Status", value: $status, inline: false },
                  { name: "Categories", value: $count, inline: true },
                  { name: "Run", value: ("#" + $run_number + " (ID: " + $run_id + ")"), inline: true },
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Triggered by", value: $actor, inline: true },
                  { name: "Actions URL", value: $url, inline: false }
                ],
                timestamp: $date,
                footer: { text: "MaPrice Scraper" }
              }]
            }' | curl -s -H "Content-Type: application/json" -d @- "$WEBHOOK"
