name: products-scraping

on:
  schedule:
    - cron: "0 0,6,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_VERSION: "10"
  NODE_VERSION: "22"

jobs:
  get-pairs:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.get.outputs.pairs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MAIN_REPO }}
          token: ${{ secrets.MY_PAT }}
          path: project

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: project
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma generate

      - name: Get retailer-category pairs
        working-directory: project
        id: get
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXCLUDE_RETAILERS: "auto"
        shell: bash
        run: |
          echo "Current dir: $(pwd)"
          ls -la scripts/ 2>/dev/null || echo "scripts/ not found"
          pairs=$(pnpm exec tsx scripts/get-retailer-category-pairs.ts)
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "Script failed with exit code $exit_code"
            exit $exit_code
          fi
          echo "Raw pairs:"
          echo "$pairs"
          if [ -z "$pairs" ] || [ "$pairs" = "null" ]; then
            pairs="[]"
          fi
          delimiter=$(dd if=/dev/urandom bs=1 count=16 2>/dev/null | od -An -tx1 | tr -d ' \n')
          echo "pairs<<$delimiter" >> "$GITHUB_OUTPUT"
          echo "$pairs" >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"

  run:
    needs: get-pairs
    if: ${{ needs.get-pairs.outputs.pairs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        pair: ${{ fromJson(needs.get-pairs.outputs.pairs) }}
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: >-
          --health-cmd="curl -f http://localhost:8191/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MAIN_REPO }}
          token: ${{ secrets.MY_PAT }}
          path: project

      - name: Extract category and retailer
        id: extract
        shell: bash
        run: |
          echo "retailer=$(echo '${{ matrix.pair }}' | cut -d: -f1)" >> "$GITHUB_OUTPUT"
          echo "category=$(echo '${{ matrix.pair }}' | cut -d: -f2)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml

      - name: Locate pnpm store
        id: pnpm-store
        working-directory: project
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('project/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('project/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-

      - name: Install dependencies
        working-directory: project
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma generate

      - name: Install Playwright browsers
        working-directory: project
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for FlareSolverr
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://flaresolverr:8191/health > /dev/null 2>&1; then
              echo "FlareSolverr ready"
              exit 0
            fi
            echo "Waiting for FlareSolverr... ($i/30)"
            sleep 3
          done
          echo "FlareSolverr failed to start"
          exit 1

      - name: Run scraper
        id: scrape
        working-directory: project
        env:
          ENABLE_SCRAPING: "true"
          CATEGORY: ${{ steps.extract.outputs.category }}
          RETAILER: ${{ steps.extract.outputs.retailer }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          CF_BACKEND: flaresolverr
          CF_BYPASS_API_URL: http://flaresolverr:8191
          TWO_CAPTCHA_KEY: ${{ secrets.TWO_CAPTCHA_KEY }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          EXCLUDE_RETAILERS: "auto"
        continue-on-error: true
        run: stdbuf -oL pnpm -s scrape:update-prices --category "$CATEGORY" --retailer "$RETAILER" --report --max-failure-rate 50 2>&1 | tee scrape-output.log

      - name: Upload artifacts on failure
        if: steps.scrape.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: scrape-report-${{ steps.extract.outputs.retailer }}-${{ steps.extract.outputs.category }}-${{ github.run_id }}
          path: |
            reports/
            scrape-output.log
          retention-days: 7

      - name: Fail step if scrape failed
        if: steps.scrape.outcome == 'failure'
        run: exit 1

  notify:
    needs:
      - get-pairs
      - run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect results
        id: collect
        shell: bash
        run: |
          RUN_RESULT="${{ needs.run.result }}"
          if [ "$RUN_RESULT" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="All retailer-category pairs processed"
            COLOR=5763719
          elif [ "$RUN_RESULT" = "skipped" ]; then
            STATUS_EMOJI="⏭️"
            STATUS_TEXT="Skipped (no pairs)"
            COLOR=16763904
          elif [ "$RUN_RESULT" = "cancelled" ]; then
            STATUS_EMOJI="❌"
            STATUS_TEXT="Cancelled"
            COLOR=15548997
          else
            STATUS_EMOJI="⚠️"
            STATUS_TEXT="Some pairs failed"
            COLOR=16744480
          fi
          PAIRS_RAW='${{ needs.get-pairs.outputs.pairs }}'
          PAIR_COUNT=$(echo "$PAIRS_RAW" | jq '. | length' 2>/dev/null || echo "0")
          echo "status_emoji=$STATUS_EMOJI" >> "$GITHUB_OUTPUT"
          echo "status_text=$STATUS_TEXT" >> "$GITHUB_OUTPUT"
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"
          echo "pair_count=$PAIR_COUNT" >> "$GITHUB_OUTPUT"

      - name: Send notification
        env:
          STATUS_EMOJI: ${{ steps.collect.outputs.status_emoji }}
          STATUS_TEXT: ${{ steps.collect.outputs.status_text }}
          COLOR: ${{ steps.collect.outputs.color }}
          PAIR_COUNT: ${{ steps.collect.outputs.pair_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.triggering_actor }}
          WEBHOOK: ${{ secrets.WEBHOOK }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          jq -n \
            --arg emoji "$STATUS_EMOJI" \
            --arg status "$STATUS_TEXT" \
            --argjson color "$COLOR" \
            --arg count "$PAIR_COUNT" \
            --arg url "$RUN_URL" \
            --arg run_id "$RUN_ID" \
            --arg run_number "$RUN_NUMBER" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              embeds: [{
                title: ($emoji + " Price Update " + (if $emoji == "✅" then "Succeeded" elif $emoji == "⚠️" then "Partial" else "Failed" end)),
                color: $color,
                fields: [
                  { name: "Status", value: $status, inline: true },
                  { name: "Pairs processed", value: $count, inline: true },
                  { name: "Run", value: ("#" + $run_number + " (ID: " + $run_id + ")"), inline: true },
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Triggered by", value: $actor, inline: true },
                  { name: "Actions URL", value: $url, inline: false }
                ],
                timestamp: $date,
                footer: { text: "Scraper" }
              }]
            }' | curl -s -H "Content-Type: application/json" -d @- "$WEBHOOK"
