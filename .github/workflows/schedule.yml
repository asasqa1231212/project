name: products-scraping

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_VERSION: "10"
  NODE_VERSION: "22"

jobs:
  get-categories:
    runs-on: ubuntu-latest
    outputs:
      categories: ${{ steps.get.outputs.categories }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MAIN_REPO }}
          token: ${{ secrets.MY_PAT }}
          path: project

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: project
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma generate

      - name: Get categories
        id: get
        working-directory: project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          categories=$(pnpm exec tsx scripts/get-categories-from-db.ts 2>/dev/null)
          echo "Raw categories:"
          echo "$categories"
          if [ -z "$categories" ] || [ "$categories" = "null" ]; then
            categories="[]"
          fi
          delimiter=$(dd if=/dev/urandom bs=1 count=16 2>/dev/null | od -An -tx1 | tr -d ' \n')
          echo "categories<<$delimiter" >> "$GITHUB_OUTPUT"
          echo "$categories" >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"

  run:
    needs: get-categories
    if: ${{ needs.get-categories.outputs.categories != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        category: ${{ fromJson(needs.get-categories.outputs.categories) }}
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: >-
          --health-cmd="curl -f http://localhost:8191/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MAIN_REPO }}
          token: ${{ secrets.MY_PAT }}
          path: project

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: project
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: project
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma generate

      - name: Install Playwright browsers
        working-directory: project
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for FlareSolverr
        shell: bash
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://flaresolverr:8191/health > /dev/null 2>&1; then
              echo "FlareSolverr ready"
              break
            fi
            echo "Waiting for FlareSolverr... ($i/15)"
            sleep 3
          done

      - name: Run scraper
        id: scrape
        working-directory: project
        env:
          ENABLE_SCRAPING: "true"
          CATEGORY: ${{ matrix.category }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          CF_BACKEND: flaresolverr
          CF_BYPASS_API_URL: http://flaresolverr:8191
          TWO_CAPTCHA_KEY: ${{ secrets.TWO_CAPTCHA_KEY }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        continue-on-error: true
        run: pnpm -s scrape:update-prices --report --max-failure-rate 50 2>&1 | tee scrape-output.log

      - name: Upload artifacts on failure
        if: steps.scrape.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: scrape-report-${{ matrix.category }}-${{ github.run_id }}
          path: |
            reports/
            scrape-output.log
          retention-days: 7

      - name: Fail step if scrape failed
        if: steps.scrape.outcome == 'failure'
        run: exit 1

  notify:
    needs:
      - get-categories
      - run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect results
        id: collect
        shell: bash
        run: |
          RUN_RESULT="${{ needs.run.result }}"
          if [ "$RUN_RESULT" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="All categories processed"
            COLOR=5763719
          elif [ "$RUN_RESULT" = "skipped" ]; then
            STATUS_EMOJI="⏭️"
            STATUS_TEXT="Skipped (no categories)"
            COLOR=16763904
          elif [ "$RUN_RESULT" = "cancelled" ]; then
            STATUS_EMOJI="❌"
            STATUS_TEXT="Cancelled"
            COLOR=15548997
          else
            STATUS_EMOJI="⚠️"
            STATUS_TEXT="Some categories failed"
            COLOR=16744480
          fi
          CATEGORIES_RAW='${{ needs.get-categories.outputs.categories }}'
          CATEGORY_COUNT=$(echo "$CATEGORIES_RAW" | jq '. | length' 2>/dev/null || echo "0")
          echo "status_emoji=$STATUS_EMOJI" >> "$GITHUB_OUTPUT"
          echo "status_text=$STATUS_TEXT" >> "$GITHUB_OUTPUT"
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"
          echo "category_count=$CATEGORY_COUNT" >> "$GITHUB_OUTPUT"

      - name: Send notification
        env:
          STATUS_EMOJI: ${{ steps.collect.outputs.status_emoji }}
          STATUS_TEXT: ${{ steps.collect.outputs.status_text }}
          COLOR: ${{ steps.collect.outputs.color }}
          CATEGORY_COUNT: ${{ steps.collect.outputs.category_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.triggering_actor }}
          WEBHOOK: ${{ secrets.WEBHOOK }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          jq -n \
            --arg emoji "$STATUS_EMOJI" \
            --arg status "$STATUS_TEXT" \
            --argjson color "$COLOR" \
            --arg count "$CATEGORY_COUNT" \
            --arg url "$RUN_URL" \
            --arg run_id "$RUN_ID" \
            --arg run_number "$RUN_NUMBER" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              embeds: [{
                title: ($emoji + " Price Update " + (if $emoji == "✅" then "Succeeded" elif $emoji == "⚠️" then "Partial" else "Failed" end)),
                color: $color,
                fields: [
                  { name: "Status", value: $status, inline: false },
                  { name: "Categories", value: $count, inline: true },
                  { name: "Run", value: ("#" + $run_number + " (ID: " + $run_id + ")"), inline: true },
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Triggered by", value: $actor, inline: true },
                  { name: "Actions URL", value: $url, inline: false }
                ],
                timestamp: $date,
                footer: { text: "Scraper" }
              }]
            }' | curl -s -H "Content-Type: application/json" -d @- "$WEBHOOK"
